<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crolix Meet</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.21.0.js"></script>
  <style>
/* ============================================================
   CROLIX MEET — STYLESHEET
============================================================ */

/* ─── 1. Variables & Reset ──────────────────────────────── */
:root {
  --bg-deep:      #020617;
  --bg-panel:     #0f172a;
  --bg-card:      #1e293b;
  --bg-hover:     #263549;
  --border-muted: rgba(255,255,255,0.07);
  --border-soft:  rgba(255,255,255,0.1);
  --accent:       #6366f1;
  --accent-light: #818cf8;
  --accent-dark:  #4f46e5;
  --purple:       #7c3aed;
  --red-bg:       #7f1d1d;
  --red-bg-hover: #991b1b;
  --red-text:     #fca5a5;
  --blue-bg:      #1d4ed8;
  --blue-bg-hover:#2563eb;
  --blue-text:    #bfdbfe;
  --green-accent: #22c55e;
  --text-primary: #f1f5f9;
  --text-muted:   #94a3b8;
  --text-dim:     #64748b;
  --text-soft:    #cbd5e1;
  --font:         "Poppins", sans-serif;
  --radius-sm:    8px;
  --radius-md:    12px;
  --radius-lg:    16px;
  --radius-xl:    20px;
  --transition:   0.2s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: radial-gradient(circle at top, #0f172a, var(--bg-deep));
  overflow-x: hidden;
}

/* ─── 2. Join Screen ────────────────────────────────────── */
#join-screen {
  min-height: 100vh;
  background: radial-gradient(circle at top, #0f172a, var(--bg-deep));
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  padding: 2rem 5%;
  font-family: var(--font);
}

.join-wrapper {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 1200px;
  gap: 3rem;
  flex-wrap: wrap;
}

.join-left {
  flex: 1;
  min-width: 260px;
  max-width: 500px;
}

.join-left h1 {
  font-size: clamp(1.5rem, 4vw, 2.6rem);
  line-height: 1.2;
  margin: 1.2rem 0 0.8rem;
}

.join-left .subtitle {
  color: var(--text-muted);
  margin-bottom: 1.5rem;
  font-size: clamp(0.85rem, 1.5vw, 1rem);
  line-height: 1.7;
}

.join-left .features { list-style: none; }
.join-left .features li {
  margin-bottom: 12px;
  color: var(--text-soft);
  font-size: clamp(0.85rem, 1.5vw, 1rem);
}

.join-card {
  width: clamp(280px, 40vw, 380px);
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border-soft);
  padding: clamp(1.25rem, 3vw, 2rem);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(15px);
  flex-shrink: 0;
}

.join-card h2 { margin-bottom: 4px; font-size: clamp(1.1rem, 2.5vw, 1.5rem); }
.join-card .small-text { color: var(--text-muted); font-size: 14px; margin-bottom: 1.2rem; }

.join-card label {
  display: block;
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.join-card input {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--bg-card);
  color: white;
  font-family: var(--font);
  font-size: 0.95rem;
  outline: none;
}

.join-card input:focus { box-shadow: 0 0 0 2px rgba(99,102,241,0.5); }

.join-card button#joinBtn {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  background: linear-gradient(90deg, var(--accent-dark), var(--accent));
  border: none;
  border-radius: 10px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  font-size: clamp(0.9rem, 1.5vw, 1rem);
  font-family: var(--font);
  transition: opacity var(--transition), transform var(--transition);
}

.join-card button#joinBtn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
.join-card button#joinBtn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.hint-box {
  margin-top: 15px;
  padding: 10px 12px;
  background: rgba(79,70,229,0.1);
  border: 1px solid rgba(79,70,229,0.3);
  border-radius: 10px;
  font-size: 13px;
  color: #c7d2fe;
  line-height: 1.5;
}

/* ─── 3. Meeting Screen & Top Bar ───────────────────────── */
#meeting-screen {
  position: fixed;
  inset: 0;
  background: #0b1220;
  display: flex;
  flex-direction: column;
  z-index: 9999;
  font-family: var(--font);
}

.top-bar {
  height: 56px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 clamp(1rem, 3vw, 28px);
  background: var(--bg-panel);
  color: white;
  border-bottom: 1px solid var(--border-muted);
  flex-shrink: 0;
  position: relative;
}

.meeting-info {
  display: flex;
  align-items: center;
  gap: 10px;
  overflow: hidden;
}

.meeting-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

#meeting-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 35vw;
  font-size: clamp(0.82rem, 1.8vw, 0.95rem);
  font-weight: 600;
  color: var(--text-primary);
}

.live-badge {
  background: rgba(239,68,68,0.15);
  border: 1px solid rgba(239,68,68,0.4);
  color: #ef4444;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

.premium-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 13px 5px 10px;
  border-radius: 20px;
  border: 1px solid rgba(250,204,21,0.45);
  background: linear-gradient(135deg, rgba(234,179,8,0.18), rgba(168,85,247,0.18));
  color: #fde68a;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  letter-spacing: 0.03em;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background var(--transition), transform 0.15s, box-shadow var(--transition);
  box-shadow: 0 0 10px rgba(250,204,21,0.12);
}

.premium-pill svg { stroke: #fde68a; flex-shrink: 0; }
.premium-pill:hover {
  background: linear-gradient(135deg, rgba(234,179,8,0.30), rgba(168,85,247,0.30));
  transform: translateY(-1px);
  box-shadow: 0 0 18px rgba(250,204,21,0.22);
}
.premium-pill:active { transform: scale(0.97); }

.timer {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(0.85rem, 1.8vw, 0.95rem);
  font-weight: 500;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.06em;
  pointer-events: none;
}

.participants-count {
  display: flex;
  align-items: center;
  gap: 7px;
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--border-soft);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: clamp(0.78rem, 1.5vw, 0.88rem);
  color: var(--text-soft);
  white-space: nowrap;
  cursor: pointer;
  transition: border-color 0.2s ease, background 0.2s ease;
  user-select: none;
}

.participants-count:hover {
  background: rgba(99,102,241,0.15);
  border-color: rgba(99,102,241,0.45);
}

.participants-count svg { stroke: var(--text-muted); flex-shrink: 0; }

@keyframes countPop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.18); background: rgba(99,102,241,0.25); border-color: rgba(99,102,241,0.6); }
  70%  { transform: scale(0.95); }
  100% { transform: scale(1); background: rgba(255,255,255,0.07); border-color: var(--border-soft); }
}

.participants-count.count-pop {
  animation: countPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

#count-num {
  font-weight: 700;
  font-size: 1rem;
  color: #e2e8f0;
  min-width: 1.2ch;
  text-align: center;
  transition: color 0.2s ease;
}

/* ─── 4. Video Grid & Player ────────────────────────────── */
.video-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: clamp(1rem, 2vw, 24px);
  padding: clamp(1.5rem, 3vw, 40px);
  place-items: center;
  overflow-y: auto;
}

.video-player {
  width: 100%;
  max-width: 480px;
  height: clamp(180px, 28vw, 280px);
  background: #111827;
  border-radius: var(--radius-lg);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-muted);
  animation: tileIn 0.3s cubic-bezier(0.34, 1.2, 0.64, 1) both;
  will-change: transform, opacity;
  transform: translateZ(0);
}

.video-player.screen-share-tile {
  border-color: rgba(99,102,241,0.55);
  box-shadow: 0 0 0 2px rgba(99,102,241,0.2), 0 8px 32px rgba(0,0,0,0.4);
}

@keyframes tileIn {
  from { opacity: 0; transform: scale(0.92) translateY(8px); }
  to   { opacity: 1; transform: scale(1)    translateY(0); }
}

/* ─── 5. Avatar ─────────────────────────────────────────── */
.video-player video {
  position: absolute;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover;
  border-radius: var(--radius-lg);
  z-index: 1;
}

.avatar {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-lg);
  z-index: 3;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.35);
  transition: opacity 0.25s ease;
}

.avatar-initial {
  font-family: var(--font);
  font-size: clamp(2.8rem, 7vw, 4.5rem);
  font-weight: 700;
  color: #ffffff;
  line-height: 1;
  letter-spacing: -0.02em;
  width: clamp(80px, 14vw, 120px);
  height: clamp(80px, 14vw, 120px);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  border: 2px solid rgba(255,255,255,0.32);
  backdrop-filter: blur(4px);
  box-shadow: 0 4px 24px rgba(0,0,0,0.25);
  animation: avatarPop 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
}

.avatar-name {
  font-family: var(--font);
  font-size: clamp(0.78rem, 1.6vw, 0.95rem);
  font-weight: 500;
  color: rgba(255,255,255,0.92);
  letter-spacing: 0.04em;
  text-align: center;
  max-width: 80%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  background: rgba(0,0,0,0.32);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 100px;
  padding: 5px 16px;
  backdrop-filter: blur(6px);
  animation: avatarNameSlide 0.4s ease 0.1s both;
}

@keyframes avatarPop {
  from { transform: scale(0.6); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}

@keyframes avatarNameSlide {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.name-tag {
  position: absolute;
  bottom: 12px;
  left: 12px;
  background: rgba(0,0,0,0.68);
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  font-size: clamp(11px, 1.4vw, 13px);
  font-weight: 500;
  color: white;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 80%;
  z-index: 4;
}

/* ─── 6. Controls ───────────────────────────────────────── */
.controls {
  height: clamp(85px, 11vw, 110px);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(12px, 2.5vw, 28px);
  background: var(--bg-panel);
  border-top: 1px solid rgba(255,255,255,0.05);
  flex-shrink: 0;
  padding: 0 1.5rem;
  flex-wrap: wrap;
}

.control-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  width: clamp(68px, 10vw, 88px);
  height: clamp(68px, 10vw, 88px);
  border-radius: 14px;
  border: none;
  background: var(--bg-card);
  color: var(--text-soft);
  cursor: pointer;
  transition: background var(--transition), transform var(--transition), opacity var(--transition);
  font-family: var(--font);
}

.control-btn:hover:not(:disabled) { background: var(--bg-hover); transform: translateY(-2px); }
.control-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

.btn-icon { display: flex; align-items: center; justify-content: center; }
.btn-icon svg { stroke: currentColor; }
.btn-label { font-size: clamp(9px, 1.2vw, 11px); font-weight: 500; letter-spacing: 0.02em; white-space: nowrap; }

.control-btn.muted,
.control-btn.video-off,
.control-btn.leave    { background: var(--red-bg);       color: var(--red-text); }
.control-btn.muted:hover:not(:disabled),
.control-btn.video-off:hover:not(:disabled),
.control-btn.leave:hover:not(:disabled) { background: var(--red-bg-hover); }

.share-btn       { background: var(--blue-bg);      color: var(--blue-text); }
.share-btn:hover:not(:disabled) { background: var(--blue-bg-hover); }
.share-btn.sharing { background: #1e40af; color: #93c5fd; }

/* ─── 7. Schedule Modal ─────────────────────────────────── */
.sched-overlay {
  position: fixed;
  inset: 0;
  background: rgba(2,6,23,0.82);
  backdrop-filter: blur(6px);
  z-index: 100000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.sched-overlay.open { opacity: 1; }

.sched-modal {
  width: 100%;
  max-width: 520px;
  background: var(--bg-panel);
  border: 1px solid rgba(99,102,241,0.25);
  border-radius: var(--radius-xl);
  box-shadow: 0 24px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
  overflow: hidden;
  transform: translateY(24px) scale(0.97);
  opacity: 0;
  transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1), opacity 0.3s ease;
}

.sched-overlay.open .sched-modal { transform: translateY(0) scale(1); opacity: 1; }

.sched-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px;
  background: linear-gradient(135deg, rgba(79,70,229,0.2), rgba(168,85,247,0.15));
  border-bottom: 1px solid var(--border-muted);
}

.sched-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 600;
  color: #e0e7ff;
  font-family: var(--font);
}

.sched-header-left svg { stroke: var(--accent-light); }

.sched-close {
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--border-soft);
  color: var(--text-muted);
  width: 30px; height: 30px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition), color var(--transition);
  font-family: var(--font);
  flex-shrink: 0;
}

.sched-close:hover { background: rgba(239,68,68,0.2); color: var(--red-text); }

.sched-body { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.sched-row  { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.sched-field { display: flex; flex-direction: column; gap: 6px; }

.sched-field label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.06em;
  font-family: var(--font);
  text-transform: uppercase;
}

.req      { color: #f87171; }
.optional { font-size: 10px; color: #475569; text-transform: none; letter-spacing: 0; font-weight: 400; }

.sched-field input,
.sched-field textarea {
  background: var(--bg-card);
  border: 1px solid var(--border-muted);
  border-radius: 10px;
  padding: 11px 13px;
  color: var(--text-primary);
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  width: 100%;
  transition: border-color var(--transition), box-shadow var(--transition);
  resize: none;
}

.sched-field input:focus,
.sched-field textarea:focus {
  border-color: rgba(99,102,241,0.6);
  box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
}

.sched-field input[type="date"],
.sched-field input[type="time"] { color-scheme: dark; }

.sched-copy-wrap { position: relative; display: flex; align-items: center; }
.sched-copy-wrap input { padding-right: 42px; }

.sched-copy-btn {
  position: absolute;
  right: 8px;
  background: rgba(99,102,241,0.15);
  border: 1px solid rgba(99,102,241,0.3);
  border-radius: 7px;
  color: var(--accent-light);
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background var(--transition), transform 0.15s;
  flex-shrink: 0;
}

.sched-copy-btn:hover  { background: rgba(99,102,241,0.28); transform: scale(1.05); }
.sched-copy-btn.copied { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.4); color: #86efac; }

.sched-err {
  color: #f87171;
  font-size: 13px;
  font-family: var(--font);
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.2);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
}

.sched-submit {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 14px;
  background: linear-gradient(135deg, var(--accent-dark), var(--purple));
  border: none;
  border-radius: var(--radius-md);
  color: white;
  font-weight: 600;
  font-size: 15px;
  font-family: var(--font);
  cursor: pointer;
  transition: opacity var(--transition), transform 0.15s, box-shadow var(--transition);
  box-shadow: 0 4px 20px rgba(79,70,229,0.35);
  width: 100%;
  margin-top: 4px;
}

.sched-submit:hover:not(:disabled) {
  opacity: 0.92;
  transform: translateY(-1px);
  box-shadow: 0 6px 28px rgba(79,70,229,0.45);
}

.sched-submit:disabled { opacity: 0.55; cursor: not-allowed; }
.sched-submit svg { stroke: white; flex-shrink: 0; }

/* ─── 8. Success Toast ──────────────────────────────────── */
#sched-success-toast {
  position: fixed;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  z-index: 200000;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34,1.2,0.64,1);
}

#sched-success-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.sched-toast-inner {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--bg-panel);
  border: 1px solid rgba(34,197,94,0.35);
  border-radius: var(--radius-lg);
  padding: 14px 22px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.55), 0 0 0 1px rgba(34,197,94,0.1);
  backdrop-filter: blur(12px);
  white-space: nowrap;
}

.sched-toast-icon {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(34,197,94,0.25), rgba(16,185,129,0.15));
  border: 1px solid rgba(34,197,94,0.35);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.sched-toast-icon svg { stroke: #4ade80; }
.sched-toast-title { font-size: 15px; font-weight: 700; color: #f0fdf4; font-family: var(--font); }
.sched-toast-sub   { font-size: 13px; color: #86efac; font-family: var(--font); margin-top: 2px; }

/* ─── 9. Animations ─────────────────────────────────────── */
.splash {
  display: flex;
  align-items: center;
  gap: 22px;
  animation: fadeIn 0.9s ease forwards;
  opacity: 0;
  overflow: visible;
  position: relative;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.96); }
  to   { opacity: 1; transform: scale(1); }
}

.logo-icon {
  width: 72px; height: 72px;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
  animation: popIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
}

@keyframes popIn {
  from { transform: scale(0.7); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}

.logo-text {
  display: flex;
  align-items: baseline;
  position: relative;

/* ─── 10. Participants Panel ────────────────────────────── */
.participants-panel {
  position: absolute;
  top: 56px;
  right: 0;
  width: clamp(220px, 28vw, 300px);
  height: calc(100% - 56px - clamp(85px, 11vw, 110px));
  background: var(--bg-panel);
  border-left: 1px solid var(--border-muted);
  display: flex;
  flex-direction: column;
  z-index: 50;
  overflow: hidden;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-muted);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-soft);
  flex-shrink: 0;
}

.panel-header svg { stroke: var(--text-muted); }

.panel-close-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
  padding: 4px 8px;
  border-radius: 6px;
  transition: background var(--transition), color var(--transition);
}

.panel-close-btn:hover { background: rgba(239,68,68,0.15); color: var(--red-text); }

.participants-list {
  flex: 1;
  overflow-y: auto;
  list-style: none;
  padding: 8px 0;
}

.participants-list::-webkit-scrollbar { width: 4px; }
.participants-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

.participant-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  transition: background var(--transition);
}

.participant-item:hover { background: rgba(255,255,255,0.04); }

.p-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 700;
  color: white;
  flex-shrink: 0;
}

.p-name {
  flex: 1;
  font-family: var(--font);
  font-size: 13px;
  color: var(--text-soft);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.p-indicators {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.p-status {
  width: 24px; height: 24px;

}

.p-status.mic-on  { background: rgba(34,197,94,0.15);  color: #4ade80; }
.p-status.mic-off { background: rgba(239,68,68,0.12);  color: #f87171; }

.p-status.cam-off { background: rgba(239,68,68,0.12);  color: #f87171; }

/* ─── 11. Join / Leave Notification Toasts ──────────────── */
.notif-container {
  position: fixed;
  bottom: calc(clamp(85px, 11vw, 110px) + 16px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  pointer-events: none;
}

.notif-toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  border-radius: 100px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  backdrop-filter: blur(12px);
  white-space: nowrap;
  opacity: 0;
  transform: translateY(12px) scale(0.96);
  transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34,1.2,0.64,1);
  pointer-events: none;
}

.notif-toast.notif-show { opacity: 1; transform: translateY(0) scale(1); }

.notif-join  { background: rgba(15,23,42,0.88); border: 1px solid rgba(34,197,94,0.35); color: #86efac; }
.notif-leave { background: rgba(15,23,42,0.88); border: 1px solid rgba(239,68,68,0.3);  color: #fca5a5; }

.notif-icon {
  width: 20px; height: 20px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}

.notif-icon-join  { background: rgba(34,197,94,0.2);  color: #4ade80; }
.notif-icon-leave { background: rgba(239,68,68,0.15); color: #f87171; }
.notif-msg { color: inherit; }

/* ─── 12. Screen Zoom Overlay ───────────────────────────── */
.screen-zoom-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.28s ease;
}

.screen-zoom-overlay.open { opacity: 1; }

.screen-zoom-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(2,6,23,0.92);
  backdrop-filter: blur(8px);
}

.screen-zoom-modal {
  position: relative;
  z-index: 1;
  width: 94vw;
  max-width: 1340px;
  height: 88vh;
  background: #0a1120;
  border: 1px solid rgba(99,102,241,0.3);
  border-radius: var(--radius-xl);
  box-shadow: 0 32px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: scale(0.96);
  transition: transform 0.28s cubic-bezier(0.34,1.1,0.64,1);
}

.screen-zoom-overlay.open .screen-zoom-modal { transform: scale(1); }

.screen-zoom-overlay:fullscreen .screen-zoom-modal,
.screen-zoom-overlay:-webkit-full-screen .screen-zoom-modal,
.screen-zoom-overlay:-moz-full-screen .screen-zoom-modal {
  width: 100vw; max-width: 100vw; height: 100vh; border-radius: 0; border: none;
}

.screen-zoom-header {
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border-muted);
  flex-shrink: 0;
}

.screen-zoom-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-soft);
}

.screen-zoom-title svg { stroke: var(--accent-light); flex-shrink: 0; }

.screen-zoom-controls { display: flex; align-items: center; gap: 6px; }

.screen-zoom-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border-muted);
  background: rgba(255,255,255,0.05);
  color: var(--text-muted);
  cursor: pointer;
  transition: background var(--transition), border-color var(--transition), color var(--transition), transform 0.12s;
}

.screen-zoom-btn:hover {
  background: rgba(99,102,241,0.18);
  border-color: rgba(99,102,241,0.45);
  color: var(--accent-light);
  transform: scale(1.06);
}

.screen-zoom-btn:active { transform: scale(0.95); }

  background: rgba(99,102,241,0.12);
  border-color: rgba(99,102,241,0.35);
  color: var(--accent-light);
}

#szoomFullscreen:hover {
  background: rgba(99,102,241,0.28);

}

.screen-zoom-close-btn { border-color: rgba(239,68,68,0.3); }

  background: rgba(239,68,68,0.2);
  border-color: rgba(239,68,68,0.6);

}

.screen-zoom-level {

.screen-zoom-divider { width: 1px; height: 22px; background: var(--border-muted); margin: 0 4px; }

.screen-zoom-canvas video {

const AVATAR_GRADIENTS = [
  ["#6366f1","#818cf8"],["#0ea5e9","#38bdf8"],["#10b981","#34d399"],
  ["#f59e0b","#fbbf24"],["#ef4444","#f87171"],["#8b5cf6","#a78bfa"],
  ["#ec4899","#f472b6"],["#14b8a6","#2dd4bf"],
];

function gradientForName(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) | 0;
  const [a, b] = AVATAR_GRADIENTS[Math.abs(hash) % AVATAR_GRADIENTS.length];
  return `linear-gradient(135deg, ${a}, ${b})`;
}

function initLogoAbsorption(container) {
  const ENTRANCE_DELAY      = 1500;
  const ABSORPTION_DURATION = 2200;
  const LOOP_INTERVAL       = 8000;
  let absorptionTimeout = null;
  let loopInterval      = null;
  function triggerAbsorption() {
    const splash = container.querySelector(".splash");
    if (!splash) return;
    const joinScreen = container.querySelector("#join-screen");
    if (joinScreen && joinScreen.style.display === "none") return;
    splash.classList.add("absorbing");
    absorptionTimeout = setTimeout(() => { splash.classList.remove("absorbing"); }, ABSORPTION_DURATION + 50);
  }
  setTimeout(() => {
    triggerAbsorption();
    loopInterval = setInterval(triggerAbsorption, LOOP_INTERVAL);
  }, ENTRANCE_DELAY);
  return function cleanup() {
    clearTimeout(absorptionTimeout);
    clearInterval(loopInterval);
  };
}

function loadFirestore(config) {
  const loadScript = (src) => new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  return Promise.all([
    loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"),
    loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"),
  ]).then(() => {
    if (!firebase.apps.length) firebase.initializeApp(config);
    return firebase.firestore();
  });
}

class ScreenZoomController {
  constructor(container) {
    this.container    = container;
    this._scale       = 1;
    this._minScale    = 0.5;
    this._maxScale    = 4;
    this._scaleStep   = 0.25;
    this._originX     = 0;
    this._originY     = 0;
    this._dragging    = false;
    this._dragStartX  = 0;
    this._dragStartY  = 0;
    this._dragOriginX = 0;
    this._dragOriginY = 0;
    this._activeTrack = null;
    this._open        = false;
    this._isNativeFS  = false;
    this._overlay  = container.querySelector("#screen-zoom-overlay");
    this._viewport = container.querySelector("#screen-zoom-viewport");
    this._canvas   = container.querySelector("#screen-zoom-canvas");
    this._label    = container.querySelector("#screen-zoom-label");
    this._levelEl  = container.querySelector("#szoom-level");
    this._fsBtn    = container.querySelector("#szoomFullscreen");
    this._bindOverlayEvents();
    this._bindFullscreenChange();
  }
  open(track, sharerName) {
    if (!track || this._open) return;
    this._activeTrack = track;
    this._open        = true;
    this._scale       = 1;
    this._originX     = 0;
    this._originY     = 0;
    if (this._label) this._label.textContent = `${sharerName || "Screen"} — Screen Share`;
    this._canvas.innerHTML = "";
    track.play(this._canvas);
    this._applyTransform();
    this._updateLevelDisplay();
    this._overlay.style.display = "flex";
    requestAnimationFrame(() => this._overlay.classList.add("open"));
  }
  close() {
    if (!this._open) return;
    if (this._isNativeFS) this._exitNativeFullscreen();
    this._open = false;
    this._overlay.classList.remove("open");
    setTimeout(() => {
      this._overlay.style.display = "none";
      this._canvas.innerHTML = "";
      this._activeTrack = null;
    }, 280);
  }
  zoomIn()    { this._setScale(this._scale + this._scaleStep); }
  zoomOut()   { this._setScale(this._scale - this._scaleStep); }
  zoomReset() { this._scale = 1; this._originX = 0; this._originY = 0; this._applyTransform(); this._updateLevelDisplay(); }
  _setScale(newScale) { this._scale = Math.min(this._maxScale, Math.max(this._minScale, newScale)); this._applyTransform(); this._updateLevelDisplay(); }
  _applyTransform() { this._canvas.style.transform = `translate(${this._originX}px, ${this._originY}px) scale(${this._scale})`; }
  _updateLevelDisplay() { if (this._levelEl) this._levelEl.textContent = `${Math.round(this._scale * 100)}%`; }
  _requestNativeFullscreen() {
    const el = this._overlay;
    const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (rfs) rfs.call(el).catch(() => {});
  }
  _exitNativeFullscreen() {
    const efs = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (efs) efs.call(document).catch(() => {});
  }
  toggleNativeFullscreen() {
    if (this._isNativeFS) this._exitNativeFullscreen();
    else this._requestNativeFullscreen();
  }
  _bindFullscreenChange() {
    const handler = () => {
      const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      this._isNativeFS = !!(fsEl && fsEl === this._overlay);
      if (this._fsBtn) {
        this._fsBtn.innerHTML = this._isNativeFS ? ICONS.exitFullscreen : ICONS.fullscreen;
        this._fsBtn.title = this._isNativeFS ? "Exit Fullscreen" : "Toggle Fullscreen";
      }
    };
    document.addEventListener("fullscreenchange", handler);
    document.addEventListener("webkitfullscreenchange", handler);
    document.addEventListener("mozfullscreenchange", handler);
    document.addEventListener("MSFullscreenChange", handler);
  }
  _bindOverlayEvents() {
    const overlay  = this._overlay;
    const viewport = this._viewport;
    const canvas   = this._canvas;
    this.container.querySelector("#szoomIn")?.addEventListener("click", () => this.zoomIn());
    this.container.querySelector("#szoomOut")?.addEventListener("click", () => this.zoomOut());
    this.container.querySelector("#szoomReset")?.addEventListener("click", () => this.zoomReset());
    this.container.querySelector("#szoomClose")?.addEventListener("click", () => this.close());
    this.container.querySelector("#szoomFullscreen")?.addEventListener("click", () => this.toggleNativeFullscreen());
    overlay.querySelector(".screen-zoom-backdrop")?.addEventListener("click", () => this.close());
    canvas.addEventListener("dblclick", () => this.close());
    document.addEventListener("keydown", (e) => {
      if (!this._open) return;
      if (e.key === "Escape") this.close();
      if (e.key === "=" || e.key === "+") { e.preventDefault(); this.zoomIn(); }
      if (e.key === "-") { e.preventDefault(); this.zoomOut(); }
      if (e.key === "0") { e.preventDefault(); this.zoomReset(); }
      if (e.key === "f" || e.key === "F") { e.preventDefault(); this.toggleNativeFullscreen(); }
    });
    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -this._scaleStep : this._scaleStep;
      this._setScale(this._scale + delta);
    }, { passive: false });
    canvas.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      this._dragging    = true;
      this._dragStartX  = e.clientX;
      this._dragStartY  = e.clientY;
      this._dragOriginX = this._originX;
      this._dragOriginY = this._originY;
      canvas.style.cursor = "grabbing";
      e.preventDefault();
    });
    document.addEventListener("mousemove", (e) => {
      if (!this._dragging) return;
      this._originX = this._dragOriginX + (e.clientX - this._dragStartX);
      this._originY = this._dragOriginY + (e.clientY - this._dragStartY);
      this._applyTransform();
    });
    document.addEventListener("mouseup", () => {
      if (!this._dragging) return;
      this._dragging = false;
      canvas.style.cursor = "grab";
    });
    let lastTouchDist = null, lastTouchX = null, lastTouchY = null;
    viewport.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      } else if (e.touches.length === 1) { lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY; }
    }, { passive: true });
    viewport.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2) {
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        if (lastTouchDist) { const ratio = dist / lastTouchDist; this._setScale(this._scale * ratio); }
        lastTouchDist = dist;
        e.preventDefault();
      } else if (e.touches.length === 1 && lastTouchX !== null) {
        this._originX += e.touches[0].clientX - lastTouchX;
        this._originY += e.touches[0].clientY - lastTouchY;
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
        this._applyTransform();
        e.preventDefault();
      }
    }, { passive: false });
    viewport.addEventListener("touchend", () => { lastTouchDist = null; lastTouchX = null; lastTouchY = null; }, { passive: true });
  }
}

class VideoCall {
  constructor(containerId) {
    this.container = document.getElementById(containerId);
    this.appId  = "48e1240440fa48e29297863ed05ac95f";
    this.token  = null;
    this.client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
    this.localTracks    = [];
    this.screenTrack    = null;
    this.joined         = false;
    this.joining        = false;
    this.audioMuted     = true;
    this.videoMuted     = true;
    this.screenSharing  = false;
    this.timerInterval  = null;
    this.secondsElapsed = 0;
    this._emailjsReady  = false;
    this._prewarmDone     = false;
    this._prewarmPending  = false;
    this._prewarmedTracks = null;
    this._db             = null;
    this._participantRef = null;
    this._unsubscribe    = null;
    this._channelId      = null;
    this._localUid       = null;
    this._localName      = null;
    this._participants = {};
    this._seenUids     = new Set();
    this._initialLoad  = true;
    this._presenceWritten = false;
    this._logoAnimCleanup = null;
    this._presencePromise = null;
    this._remoteScreenTracks = {};
    loadFirestore(FIREBASE_CONFIG)
      .then(db  => { this._db = db; })
      .catch(err => console.error("Firestore load failed:", err));
    this._buildUI();
    this._bindEvents();
    this._loadEmailJS();
    this._logoAnimCleanup = initLogoAbsorption(this.container);
    this._screenZoom = new ScreenZoomController(this.container);
  }

  async _prewarmTracks() {
    if (this._prewarmDone || this._prewarmPending) return;
    this._prewarmPending = true;
    try {
      this._prewarmedTracks = await AgoraRTC.createMicrophoneAndCameraTracks();
      await this._prewarmedTracks[0].setEnabled(false);
      await this._prewarmedTracks[1].setEnabled(false);
      this._prewarmDone = true;
    } catch (err) { this._prewarmedTracks = null; }
    this._prewarmPending = false;
  }

  _showNotif(message, type = "join") {
    const container = this.container.querySelector("#notif-container");
    if (!container) return;
    const notif = document.createElement("div");
    notif.className = `notif-toast notif-${type}`;
    const icon = type === "join"
      ? `<span class="notif-icon notif-icon-join">→</span>`
      : `<span class="notif-icon notif-icon-leave">←</span>`;
    notif.innerHTML = `${icon}<span class="notif-msg">${message}</span>`;
    container.appendChild(notif);
    requestAnimationFrame(() => notif.classList.add("notif-show"));
    setTimeout(() => { notif.classList.remove("notif-show"); setTimeout(() => notif.remove(), 400); }, 4000);
  }

  _saveNameToCollection(name) {
    if (!this._db) return;
    this._db.collection("name").add({ name }).catch(err => console.warn("Could not save name:", err));
  }

  async _registerPresence(channelId, uid, name, email = "") {
    if (!this._db) return null;
    const ref = this._db.collection("meetings").doc(channelId).collection("participants").doc(String(uid));
    this._participantRef = ref;
    await ref.set({ uid: String(uid), name, email, videoMuted: true, audioMuted: true, joinedAt: Date.now() });
    this._presenceWritten = true;
    return ref;
  }

  async _deletePresence(channelId, uid) {
    if (!this._db) return;
    if (this._participantRef) { try { await this._participantRef.delete(); return; } catch (_) {} }
    if (channelId && uid) {
      try { await this._db.collection("meetings").doc(channelId).collection("participants").doc(String(uid)).delete(); return; } catch (_) {}
    }
  }

  _updateVideoState(muted) {
    if (!this._participantRef) return;
    this._participantRef.update({ videoMuted: muted }).catch(() => {});
    if (this._localUid && this._participants[this._localUid]) this._participants[this._localUid].videoMuted = muted;
  }

  _updateAudioState(muted) {
    if (!this._participantRef) return;
    this._participantRef.update({ audioMuted: muted }).catch(() => {});
    if (this._localUid && this._participants[this._localUid]) this._participants[this._localUid].audioMuted = muted;
  }

  _listenToParticipants(channelId, localUid) {
    if (!this._db) return;
    if (this._unsubscribe) { this._unsubscribe(); this._unsubscribe = null; }
    this._initialLoad = true;
    const colRef = this._db.collection("meetings").doc(channelId).collection("participants");
    this._unsubscribe = colRef.onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        const data = change.doc.data();
        if (!data) return;
        const uid  = String(data.uid || change.doc.id);
        const name = data.name || "Participant";
        const isLocalUser = uid === localUid;
        if (change.type === "added") {
          this._participants[uid] = { name, videoMuted: data.videoMuted !== false, audioMuted: data.audioMuted !== false, joinedAt: data.joinedAt || Date.now() };
          if (!isLocalUser) {
            let player = document.getElementById(`remote-${uid}`);
            if (!player) player = this.createPlayer(`remote-${uid}`, name);
            this._applyAvatarState(player, name, data.videoMuted !== false);
            if (!this._initialLoad) this._showNotif(`${name} joined the meeting`, "join");
          }
          this._seenUids.add(uid);
          this._updateCountDisplay();
          this._renderParticipantsList();
        }
        if (change.type === "modified") {
          this._participants[uid] = { name, videoMuted: data.videoMuted !== false, audioMuted: data.audioMuted !== false, joinedAt: data.joinedAt || 0 };
          if (!isLocalUser) { const player = document.getElementById(`remote-${uid}`); if (player) this._applyAvatarState(player, name, data.videoMuted !== false); }
          this._renderParticipantsList();
        }
        if (change.type === "removed") {
          const leavingName = this._participants[uid]?.name || name;
          delete this._participants[uid];
          this._seenUids.delete(uid);
          if (!isLocalUser) { document.getElementById(`remote-${uid}`)?.remove(); this._showNotif(`${leavingName} left the meeting`, "leave"); }
          this._updateCountDisplay();
          this._renderParticipantsList();
        }
      });
      if (this._initialLoad) this._initialLoad = false;
    }, err => console.error("Firestore listener error:", err));
  }

  _updateCountDisplay() {
    if (!this.countEl) return;
    const count = Object.keys(this._participants || {}).length;
    this.countEl.textContent = count;
    const panelCount = this.container.querySelector("#panel-count");
    if (panelCount) panelCount.textContent = count;
  }

  _renderParticipantsList() {
    const list = this.container.querySelector("#participants-list");
    if (!list) return;
    list.innerHTML = "";
    const sorted = Object.entries(this._participants).sort(([uidA, infoA], [uidB, infoB]) => {
      if (uidA === this._localUid) return -1;
      if (uidB === this._localUid) return 1;
      return (infoA.joinedAt || 0) - (infoB.joinedAt || 0);
    });
    sorted.forEach(([uid, info]) => {
      const isLocal = uid === this._localUid;
      const li = document.createElement("li");
      li.className = "participant-item";
      const initial = (info.name || "?").charAt(0).toUpperCase();
      const displayName = isLocal ? `${info.name} (You)` : info.name;
      const grad = gradientForName(info.name || "?");
      const camIcon = info.videoMuted
        ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="1" y1="1" x2="23" y2="23"/><path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.723v6.554a1 1 0 0 1-1.447.894L15 14"/><rect x="1" y="6" width="14" height="12" rx="2" ry="2"/></svg>`
        : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`;
      const micIcon = info.audioMuted
        ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/></svg>`
        : `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>`;
      li.innerHTML = `
        <div class="p-avatar" style="background:${grad};">${initial}</div>
        <span class="p-name">${displayName}</span>
        <div class="p-indicators">
          <span class="p-status ${info.audioMuted ? "mic-off" : "mic-on"}" title="${info.audioMuted ? "Muted" : "Unmuted"}">${micIcon}</span>
          <span class="p-status ${info.videoMuted ? "cam-off" : "cam-on"}" title="${info.videoMuted ? "Camera off" : "Camera on"}">${camIcon}</span>
        </div>
      `;
      list.appendChild(li);
    });
  }

  _toggleParticipantsPanel() {
    const panel = this.container.querySelector("#participants-panel");
    if (!panel) return;
    const isVisible = panel.style.display !== "none";
    panel.style.display = isVisible ? "none" : "flex";
    if (!isVisible) this._renderParticipantsList();
  }

  _applyAvatarState(player, name, videoMuted) {
    if (!player) return;
    const avatar = player.querySelector(".avatar");
    const nameTag = player.querySelector(".name-tag");
    const avatarName = player.querySelector(".avatar-name");
    const initial = player.querySelector(".avatar-initial");
    if (nameTag) nameTag.textContent = name;
    if (avatarName) avatarName.textContent = name;
    if (initial) initial.textContent = name.charAt(0).toUpperCase();
    if (avatar) { avatar.style.background = gradientForName(name); avatar.style.display = videoMuted ? "flex" : "none"; avatar.style.zIndex = videoMuted ? "3" : ""; }
  }

  _patchPlayerName(player, name) {
    if (!player) return;
    const displayName = name.replace(/\s*\(You\)\s*$/, "");
    const nameTag = player.querySelector(".name-tag");
    const avatarName = player.querySelector(".avatar-name");
    const initial = player.querySelector(".avatar-initial");
    const avatar = player.querySelector(".avatar");
    if (nameTag) nameTag.textContent = name;
    if (avatarName) avatarName.textContent = displayName;
    if (initial) initial.textContent = displayName.charAt(0).toUpperCase();
    if (avatar) avatar.style.background = gradientForName(displayName);
  }

  async _resolveName(uid) {
    const cached = this._participants[uid]?.name;
    if (cached) return cached;
    if (this._db && this._channelId) {
      try {
        const snap = await this._db.collection("meetings").doc(this._channelId).collection("participants").doc(String(uid)).get();
        const data = snap.data();
        if (data?.name) {
          if (!this._participants[uid]) this._participants[uid] = { name: data.name, videoMuted: true, audioMuted: true };
          else this._participants[uid].name = data.name;
          return data.name;
        }
      } catch (_) {}
    }
    return "Participant";
  }

  _isScreenShareTrack(videoTrack) {
    if (!videoTrack) return false;
    const msTrack = videoTrack._mediaStreamTrack || (typeof videoTrack.getMediaStreamTrack === "function" ? videoTrack.getMediaStreamTrack() : null);
    if (!msTrack) return false;
    const label = (msTrack.label || "").toLowerCase();
    const contentHint = (msTrack.contentHint || "").toLowerCase();
    let displaySurface = "";
    try { const settings = msTrack.getSettings?.() || {}; displaySurface = (settings.displaySurface || "").toLowerCase(); } catch (_) {}
    return displaySurface === "monitor" || displaySurface === "window" || displaySurface === "browser" || contentHint === "detail" || contentHint === "text" || label.includes("screen") || label.includes("display") || label.includes("entire") || label.includes("window");
  }

  _markScreenTile(player, uid, track, isRemote) {
    if (!player) return;
    player.classList.add("screen-share-tile");
    player.querySelector(".screen-expand-btn")?.remove();
    player.querySelector(".screen-fs-btn")?.remove();
    if (!isRemote) return;
    const expandBtn = document.createElement("button");
    expandBtn.className = "screen-expand-btn";
    expandBtn.title = "Expand screen share";
    expandBtn.innerHTML = `${ICONS.expand} <span>Expand</span>`;
    player.appendChild(expandBtn);
    const fsBtn = document.createElement("button");
    fsBtn.className = "screen-fs-btn";
    fsBtn.title = "Fullscreen";
    fsBtn.innerHTML = ICONS.fullscreen;
    player.appendChild(fsBtn);
    const openZoom = () => { const sharerName = this._participants[uid]?.name || "Participant"; this._screenZoom.open(track, sharerName); };
    const openFullscreen = (e) => {
      e.stopPropagation();
      const sharerName = this._participants[uid]?.name || "Participant";
      if (!this._screenZoom._open) { this._screenZoom.open(track, sharerName); setTimeout(() => this._screenZoom._requestNativeFullscreen(), 120); }
      else this._screenZoom._requestNativeFullscreen();
    };
    expandBtn.addEventListener("click", (e) => { e.stopPropagation(); openZoom(); });
    fsBtn.addEventListener("click", openFullscreen);
    player._dblclickHandler = () => openZoom();
    player.addEventListener("dblclick", player._dblclickHandler);
  }

  _unmarkScreenTile(player) {
    if (!player) return;
    player.classList.remove("screen-share-tile");
    player.querySelector(".screen-expand-btn")?.remove();
    player.querySelector(".screen-fs-btn")?.remove();
    if (player._dblclickHandler) { player.removeEventListener("dblclick", player._dblclickHandler); player._dblclickHandler = null; }
  }

  _buildUI() {
    this.container.innerHTML = buildJoinScreen() + buildMeetingScreen() + buildScheduleModal() + buildSuccessToast() + buildScreenZoomOverlay() + buildNotifContainer();
    this.joinScreen    = this.container.querySelector("#join-screen");
    this.meetingScreen = this.container.querySelector("#meeting-screen");
    this.videoStreams   = this.container.querySelector("#video-streams");
    this.timerEl       = this.container.querySelector("#meeting-timer");
    this.countEl       = this.container.querySelector("#count-num");
    this.meetingNameEl = this.container.querySelector("#meeting-name");
  }

  _bindEvents() {
    this.container.querySelector("#joinBtn").onclick        = () => this.joinChannel();
    this.container.querySelector("#leaveBtn").onclick       = () => this.leaveChannel();
    this.container.querySelector("#muteAudio").onclick      = () => this.toggleAudio();
    this.container.querySelector("#muteVideo").onclick      = () => this.toggleVideo();
    this.container.querySelector("#shareScreenBtn").onclick = () => this.shareScreen();
    this.container.querySelector("#premiumBtn").onclick     = () => this.openSchedule();
    this.container.querySelector("#schedClose").onclick     = () => this.closeSchedule();
    this.container.querySelector("#schedCopyId").onclick    = () => this.copyMeetingId();
    this.container.querySelector("#schedSubmit").onclick    = () => this.submitSchedule();
    this.container.querySelector("#schedule-overlay").onclick = (e) => { if (e.target.id === "schedule-overlay") this.closeSchedule(); };
    this.container.querySelector("#channelName").onkeydown = (e) => { if (e.key === "Enter") this.joinChannel(); };
    this.container.querySelector("#username").onkeydown = (e) => { if (e.key === "Enter") this.joinChannel(); };
    const prewarm = () => this._prewarmTracks();
    this.container.querySelector("#username").addEventListener("focus", prewarm, { once: true });
    this.container.querySelector("#channelName").addEventListener("focus", prewarm, { once: true });
    this.container.querySelector("#count").onclick = () => this._toggleParticipantsPanel();
    this.container.querySelector("#closePanelBtn").onclick = () => { const panel = this.container.querySelector("#participants-panel"); if (panel) panel.style.display = "none"; };
  }

  _loadEmailJS() {
    if (window.emailjs) { window.emailjs.init(EMAILJS_PUBLIC_KEY); this._emailjsReady = true; return; }
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js";
    s.onload = () => { window.emailjs.init(EMAILJS_PUBLIC_KEY); this._emailjsReady = true; };
    s.onerror = () => console.error("Failed to load EmailJS SDK.");
    document.head.appendChild(s);
  }

  openSchedule() {
    const overlay = this.container.querySelector("#schedule-overlay");
    const rawName = this.meetingNameEl.innerText.replace("Meeting: ", "");
    this.container.querySelector("#sched-meetid").value = rawName || "";
    overlay.style.display = "flex";
    requestAnimationFrame(() => overlay.classList.add("open"));
  }

  closeSchedule() {
    const overlay = this.container.querySelector("#schedule-overlay");
    overlay.classList.remove("open");
    setTimeout(() => { overlay.style.display = "none"; }, 300);
  }

  copyMeetingId() {
    const val = this.container.querySelector("#sched-meetid").value.trim();
    if (!val) return;
    navigator.clipboard.writeText(val).catch(() => {});
    const btn = this.container.querySelector("#schedCopyId");
    btn.classList.add("copied");
    setTimeout(() => btn.classList.remove("copied"), 1800);
  }

  async submitSchedule() {
    if (!this._emailjsReady || !window.emailjs) { this._schedError("Email service not ready — please try again in a moment."); return; }
    const get = (id) => this.container.querySelector(`#${id}`).value.trim();
    const name = get("sched-name"), initials = get("sched-initials"), meetId = get("sched-meetid");
    const date = get("sched-date"), time = get("sched-time"), email = get("sched-email"), message = get("sched-message");
    if (!name || !initials || !meetId || !date || !time) { this._schedError("Please fill in all required fields (*)."); return; }
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { this._schedError("Please enter a valid email address."); return; }
    const btn = this.container.querySelector("#schedSubmit");
    btn.disabled = true; btn.textContent = "Sending…";
    const formattedDate = new Date(`${date}T${time}`).toLocaleString("en-ZA", { weekday: "long", year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" });
    const hostParams = { to_email: HOST_EMAIL, from_name: name, initials, meeting_id: meetId, date_time: formattedDate, guest_email: email || "Not provided", message: message || "No additional message." };
    const guestParams = email ? { to_email: email, from_name: name, meeting_id: meetId, date_time: formattedDate, message: message || "No additional message." } : null;
    try {
      await window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_HOST, hostParams);
      if (guestParams) await window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_GUEST, guestParams);
      this.closeSchedule();
      this._showSuccessToast();
      this._resetScheduleForm();
    } catch (err) { this._schedError(`Failed to send — ${err?.text || err?.message || "Unknown error"}`); }
    finally { btn.disabled = false; btn.innerHTML = `${ICONS.send} Send Meeting Request`; }
  }

  _schedError(msg) {
    this.container.querySelector(".sched-err")?.remove();
    const err = Object.assign(document.createElement("p"), { className: "sched-err", textContent: "⚠ " + msg });
    this.container.querySelector("#schedSubmit").insertAdjacentElement("beforebegin", err);
    setTimeout(() => err.remove(), 4000);
  }

  _resetScheduleForm() {
    ["sched-name","sched-initials","sched-meetid","sched-date","sched-time","sched-email","sched-message"].forEach(id => { const el = this.container.querySelector(`#${id}`); if (el) el.value = ""; });
  }

  _showSuccessToast() {
    const toast = this.container.querySelector("#sched-success-toast");
    toast.style.display = "flex";
    toast.classList.add("show");
    setTimeout(() => { toast.classList.remove("show"); setTimeout(() => { toast.style.display = "none"; }, 500); }, 4000);
  }

  _pad(n) { return String(n).padStart(2, "0"); }

  startTimer() {
    this.secondsElapsed = 0;
    if (this.timerInterval) clearInterval(this.timerInterval);
    this.timerInterval = setInterval(() => {
      this.secondsElapsed++;
      const m = this._pad(Math.floor(this.secondsElapsed / 60));
      const s = this._pad(this.secondsElapsed % 60);
      if (this.timerEl) this.timerEl.innerText = `${m}:${s}`;
    }, 1000);
  }

  stopTimer() {
    if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
    this.secondsElapsed = 0;
    if (this.timerEl) this.timerEl.innerText = "00:00";
  }

  createPlayer(id, name) {
    const existing = document.getElementById(id);
    if (existing) return existing;
    const div = document.createElement("div");
    div.id = id;
    div.className = "video-player";
    div.innerHTML = `
      <div class="avatar" style="background:${gradientForName(name)}; display:flex; z-index:3;">
        <span class="avatar-initial">${name.charAt(0).toUpperCase()}</span>
        <span class="avatar-name">${name}</span>
      </div>
      <div class="name-tag">${name}</div>
    `;
    this.videoStreams.appendChild(div);
    return div;
  }

  async joinChannel() {
    if (this.joined || this.joining) return;
    const name    = this.container.querySelector("#username").value.trim();
    const email   = this.container.querySelector("#email").value.trim();
    const channel = this.container.querySelector("#channelName").value.trim();
    if (!name || !channel) { alert("Enter your name and a meeting ID"); return; }
    this.joining = true;
    const joinBtn = this.container.querySelector("#joinBtn");
    joinBtn.disabled = true; joinBtn.textContent = "Joining…";
    try {
      this._saveNameToCollection(name);
      let tracksPromise;
      if (this._prewarmDone && this._prewarmedTracks) {
        tracksPromise = Promise.resolve(this._prewarmedTracks);
      } else if (this._prewarmPending) {
        tracksPromise = new Promise((resolve) => {
          const poll = setInterval(() => { if (!this._prewarmPending) { clearInterval(poll); resolve(this._prewarmedTracks ? this._prewarmedTracks : AgoraRTC.createMicrophoneAndCameraTracks()); } }, 100);
        });
      } else {
        tracksPromise = AgoraRTC.createMicrophoneAndCameraTracks();
      }
      this._prewarmDone = false; this._prewarmedTracks = null;
      const [joinedUid, tracks] = await Promise.all([this.client.join(this.appId, channel, this.token, null), tracksPromise]);
      this.localTracks = tracks;
      this.uid = joinedUid;
      this._channelId = channel;
      this._localName = name;
      this._localUid  = String(joinedUid);
      await this.localTracks[0].setEnabled(true);
      await this.localTracks[1].setEnabled(true);
      await this.client.publish(this.localTracks);
      await this.localTracks[0].setMuted(true);
      await this.localTracks[1].setMuted(true);
      this.client.on("user-published", async (user, mediaType) => {
        await this.client.subscribe(user, mediaType);
        const uid = String(user.uid);
        const resolvedName = await this._resolveName(uid);
        let player = document.getElementById(`remote-${uid}`);
        if (!player) player = this.createPlayer(`remote-${uid}`, resolvedName);
        this._patchPlayerName(player, resolvedName);
        if (mediaType === "video") {
          user.videoTrack.play(player);
          const avatar = player.querySelector(".avatar");
          if (avatar) { avatar.style.display = "none"; avatar.style.zIndex = ""; }
          const isScreen = this._isScreenShareTrack(user.videoTrack);
          if (isScreen) { this._remoteScreenTracks[uid] = user.videoTrack; this._markScreenTile(player, uid, user.videoTrack, true); }
          else { this._addVideoFullscreenBtn(player, uid, user.videoTrack); }
        }
        if (mediaType === "audio") user.audioTrack.play();
      });
      this.client.on("user-unpublished", (user, mediaType) => {
        if (mediaType === "video") {
          const uid = String(user.uid);
          const player = document.getElementById(`remote-${uid}`);
          if (player) {
            const pName = this._participants[uid]?.name || "Participant";
            const avatar = player.querySelector(".avatar");
            if (avatar) { avatar.style.background = gradientForName(pName); avatar.style.display = "flex"; avatar.style.zIndex = "3"; }
            if (this._remoteScreenTracks[uid]) { delete this._remoteScreenTracks[uid]; this._unmarkScreenTile(player); if (this._screenZoom._open) this._screenZoom.close(); }
            player.querySelector(".video-fs-btn")?.remove();
          }
        }
      });
      this.client.on("user-left", (user) => {
        const uid = String(user.uid);
        if (!this._participants[uid]) { document.getElementById(`remote-${uid}`)?.remove(); this._updateCountDisplay(); }
        if (this._remoteScreenTracks[uid]) { delete this._remoteScreenTracks[uid]; if (this._screenZoom._open) this._screenZoom.close(); }
      });
      this._participants[this._localUid] = { name, videoMuted: true, audioMuted: true, joinedAt: Date.now() };
      this._listenToParticipants(channel, this._localUid);
      this.joinScreen.style.display    = "none";
      this.meetingScreen.style.display = "flex";
      this.meetingNameEl.innerText     = `Meeting: ${channel}`;
      const localPlayer = this.createPlayer("local-player", `${name} (You)`);
      this.localTracks[1].play(localPlayer);
      const localAvatar = localPlayer.querySelector(".avatar");
      if (localAvatar) localAvatar.style.display = "flex";
      this.joined  = true;
      this.joining = false;
      this.startTimer();
      this._updateCountDisplay();
      this._presenceWritten = false;
      this._presencePromise = this._registerPresence(channel, joinedUid, name, email).catch(err => { console.warn("Presence write failed:", err); return null; });
    } catch (err) {
      console.error("Join error:", err);
      alert("Could not join: " + (err.message || err));
      joinBtn.disabled = false; joinBtn.textContent = "Join Now";
      this.joining = false; this.joined = false;
      this.joinScreen.style.display = "flex"; this.meetingScreen.style.display = "none";
      this.localTracks.forEach(t => { try { t.stop(); t.close(); } catch (_) {} });
      this.localTracks = [];
      this._prewarmDone = false; this._prewarmedTracks = null;
      this._participants = {}; this._localUid = null; this._presencePromise = null;
      if (this._unsubscribe) { this._unsubscribe(); this._unsubscribe = null; }
      try { await this.client.leave(); } catch (_) {}
    }
  }

  _addVideoFullscreenBtn(player, uid, track) {
    if (!player || player.querySelector(".video-fs-btn")) return;
    const btn = document.createElement("button");
    btn.className = "video-fs-btn";
    btn.title = "Fullscreen";
    btn.innerHTML = ICONS.fullscreen;
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const sharerName = this._participants[uid]?.name || "Participant";
      this._screenZoom.open(track, sharerName);
      setTimeout(() => this._screenZoom._requestNativeFullscreen(), 120);
    });
    player.appendChild(btn);
  }

  leaveChannel() {
    if (!this.joined && !this.joining) return;
    if (this._screenZoom?._open) this._screenZoom.close();
    const pendingPresence = this._presencePromise;
    const snapshotRef     = this._participantRef;
    const snapshotChannel = this._channelId;
    const snapshotUid     = this._localUid;
    const screenTrack     = this.screenTrack;
    const localTracks     = this.localTracks.slice();
    const client          = this.client;
    const unsubscribe     = this._unsubscribe;
    this.joined = false; this.joining = false; this.audioMuted = true; this.videoMuted = true; this.screenSharing = false;
    this._participants = {}; this._seenUids.clear(); this._presenceWritten = false; this._presencePromise = null;
    this._unsubscribe = null; this._participantRef = null; this._channelId = null; this._localUid = null;
    this._localName = null; this.screenTrack = null; this.localTracks = []; this._remoteScreenTracks = {};
    if (unsubscribe) unsubscribe();
    this.stopTimer();
    this.videoStreams.innerHTML = "";
    this.meetingScreen.style.display = "none";
    this.joinScreen.style.display    = "flex";
    const panel = this.container.querySelector("#participants-panel");
    if (panel) panel.style.display = "none";
    const joinBtn = this.container.querySelector("#joinBtn");
    if (joinBtn) { joinBtn.disabled = false; joinBtn.textContent = "Join Now"; }
    const muteAudio  = this.container.querySelector("#muteAudio");
    const muteVideo  = this.container.querySelector("#muteVideo");
    const shareBtnEl = this.container.querySelector("#shareScreenBtn");
    const shareLabel = this.container.querySelector("#share-label");
    if (muteAudio)  { muteAudio.classList.add("muted");     muteAudio.innerHTML  = `<span class="btn-icon">${ICONS.micOff}</span><span class="btn-label">Mute</span>`; }
    if (muteVideo)  { muteVideo.classList.add("video-off"); muteVideo.innerHTML  = `<span class="btn-icon">${ICONS.camOff}</span><span class="btn-label">Start Video</span>`; }
    if (shareBtnEl) { shareBtnEl.classList.remove("sharing"); }
    if (shareLabel) { shareLabel.textContent = "Share"; }
    ;(async () => {
      try { if (pendingPresence) { const ref = await pendingPresence; if (!ref && snapshotRef) await snapshotRef.delete().catch(() => {}); else if (ref) await ref.delete().catch(() => {}); } else if (snapshotRef) { await snapshotRef.delete().catch(() => {}); } } catch (_) {}
      if (screenTrack) { try { screenTrack.stop(); screenTrack.close(); } catch (_) {} }
      localTracks.forEach(t => { try { t.stop(); t.close(); } catch (_) {} });
      try { await client.leave(); } catch (_) {}
    })();
  }

  async toggleAudio() {
    if (!this.joined) return;
    this.audioMuted = !this.audioMuted;
    await this.localTracks[0].setMuted(this.audioMuted);
    this._updateAudioState(this.audioMuted);
    const btn = this.container.querySelector("#muteAudio");
    if (this.audioMuted) { btn.classList.add("muted"); btn.innerHTML = `<span class="btn-icon">${ICONS.micOff}</span><span class="btn-label">Mute</span>`; }
    else { btn.classList.remove("muted"); btn.innerHTML = `<span class="btn-icon">${ICONS.micOn}</span><span class="btn-label">Unmute</span>`; }
  }

  async toggleVideo() {
    if (!this.joined) return;
    this.videoMuted = !this.videoMuted;
    await this.localTracks[1].setMuted(this.videoMuted);
    this._updateVideoState(this.videoMuted);
    const btn = this.container.querySelector("#muteVideo");
    const localPlayer = document.getElementById("local-player");
    const avatar = localPlayer?.querySelector(".avatar");
    if (this.videoMuted) {
      btn.classList.add("video-off");
      btn.innerHTML = `<span class="btn-icon">${ICONS.camOff}</span><span class="btn-label">Start Video</span>`;
      if (avatar) { avatar.style.background = gradientForName(this._localName || "You"); avatar.style.display = "flex"; avatar.style.zIndex = "3"; }
    } else {
      btn.classList.remove("video-off");
      btn.innerHTML = `<span class="btn-icon">${ICONS.camOn}</span><span class="btn-label">Stop Video</span>`;
      if (avatar) { avatar.style.display = "none"; avatar.style.zIndex = ""; }
    }
  }

  async shareScreen() {
    if (!this.joined) return;
    if (this.screenSharing) {
      this.screenSharing = false;
      const btn = this.container.querySelector("#shareScreenBtn");
      const lbl = this.container.querySelector("#share-label");
      btn.classList.remove("sharing");
      if (lbl) lbl.textContent = "Share";
      const localPlayer = document.getElementById("local-player");
      if (localPlayer) this._unmarkScreenTile(localPlayer);
      if (this.screenTrack) { try { await this.client.unpublish(this.screenTrack); this.screenTrack.stop(); this.screenTrack.close(); } catch (_) {} this.screenTrack = null; }
      try { await this.client.publish(this.localTracks[1]); } catch (_) {}
    } else {
      try {
        this.screenTrack = await AgoraRTC.createScreenVideoTrack({ encoderConfig: "1080p_1" });
        await this.client.unpublish(this.localTracks[1]);
        await this.client.publish(this.screenTrack);
        this.screenSharing = true;
        const btn = this.container.querySelector("#shareScreenBtn");
        const lbl = this.container.querySelector("#share-label");
        btn.classList.add("sharing");
        if (lbl) lbl.textContent = "Stop";
        const localPlayer = document.getElementById("local-player");
        if (localPlayer) { this.screenTrack.play(localPlayer); this._markScreenTile(localPlayer, this._localUid, this.screenTrack, false); }
        this.screenTrack.on("track-ended", () => { if (this.screenSharing) this.shareScreen(); });
      } catch (err) { if (err.name !== "NotAllowedError") console.error("Screen share error:", err); }
    }
  }
}

window.addEventListener("load", () => { new VideoCall("video-call-wrapper"); });
  </script>
</body>
